# Example interceptor settings. Copy to a real location and pass with -f.
debug: false

# Port the interceptor listens on (behind Traefik).
listenPort: 8080

# NOTE: there is no upstream/registry config. phoebe does NOT resolve upstreams.
# The forward target comes ONLY from the X-Saturn-Upstream header that Atlas
# injects on each inference deployment's per-subdomain route; phoebe forwards to
# the address on the envelope and FAILS CLOSED (refuses, never guesses) when the
# header is absent or unparseable.

# Long idle timeout: token streams can idle between chunks.
idleTimeout: "10m"

# Explicit policy: whether a client-aborted request still bills its partial
# token count.
billPartialOnAbort: true

# Durable metering emit (M2). Valkey Streams hot path → local-disk WAL fallback
# → structured-log floor. Leave valkeyAddr empty to run WAL-only.
# walPath is a DIRECTORY (tidwall/wal segment log); the historical .jsonl name
# is kept on purpose — a pre-upgrade single-file JSONL WAL found at this exact
# path is auto-imported on startup and renamed aside to "<walPath>.imported".
emit:
  valkeyAddr: "localhost:6379"
  streamName: "phoebe:metering"
  walPath: "/var/lib/phoebe/metering-wal.jsonl"

# TF single-host gateway resolution (OFF by default). On the gateway route the
# request-body model= selects the model: phoebe resolves (X-Saturn-Org-Id,
# model) from the served-model REGISTRY — Atlas-rendered ConfigMaps in the
# workload namespace (label saturncloud.io/tf-served-model: "true"), watched
# by an informer (no database, no per-request I/O; RBAC in
# deploy/rbac-gateway.yaml) — and forwards to
# <graph>-frontend.<namespace>.svc.cluster.local:<port> (the registration's
# port, or `port` below when it carries none). Requests marked
# X-Saturn-Gateway on an interceptor with this disabled are refused (503, fail
# closed); with it enabled they 503 until the registry's first sync, then keep
# resolving from last-known state across API-server flaps. namespace is
# REQUIRED when enabled: it is the platform shared-graph namespace every
# gateway-served graph (and its registry ConfigMap) lives in — phoebe never
# guesses a forward target.
# legacyPostgresResolver: true selects the DEPRECATED direct Atlas-DB
# resolution instead (kept one release for rollback; requires databaseUrl or
# the DATABASE_URL env var; databaseUrl is ignored in registry mode).
# gateway:
#   enabled: true
#   namespace: "saturn-tf-shared"
#   port: 8000
#   kubeconfig: ""
#   legacyPostgresResolver: false
#   databaseUrl: ""

# Wake-from-zero actuation (OFF by default). When enabled, a cold response on
# a wakeable route patches the graph's DGDSA <graph>-vllmworker to 1 replica
# and unpauses its KEDA ScaledObject <graph>-scaler (in that order — the KEDA
# pause handoff), holding the request until the worker serves. Requires
# gateway.namespace (where the DGDSAs live) and the RBAC in
# deploy/rbac-waker.yaml on phoebe's ServiceAccount. Uses in-cluster config;
# kubeconfig is a dev/test override. If the kubernetes config is unavailable,
# wake degrades to off (cold responses pass through) — it never crashes the
# proxy.
# timeout bounds one wake's request hold (default 300s). It MUST exceed the
# real cold start — vLLM's cold reload measured ~2.5min on staging; a smaller
# budget holds the client and then serves the cold response anyway — but it is
# also how long a doomed wake keeps a client waiting. Measured cold start +
# headroom, not impatience.
# wake:
#   enabled: true
#   kubeconfig: ""
#   timeout: "300s"

# Distributed admission for the SHARED serving tier (OFF by default). This is
# a fairness and capacity-shaping gate, not an authorization or hard-spend
# boundary. All Phoebe replicas should use the same Valkey. If that state is
# unavailable or reset, otherwise authorized and valid traffic continues while
# these limits are temporarily bypassed. Independent metering still records
# actual engine usage through its Valkey/WAL/log path.
#
# Each request is checked atomically at platform, serving-graph, organization,
# and organization×model scopes. Prompt work is the complete OpenAI JSON body
# size for the physical byte guard. Token windows reserve a cheap ceil(JSON
# bytes/4) estimate as uncached input, then reconcile the engine's exact total
# and cached token counts after the response. Output is
# max_completion_tokens/max_tokens, or defaultMaxOutputTokens. Decode capacity
# is a future slot reserved before forwarding because a proxy cannot safely
# queue once the engine starts responding. Leases release prefill/input work at
# the first upstream body byte and active/decode/output work at completion,
# abort, or failure. Live streams renew their lease;
# leaseTtl is the crash-recovery bound when a replica stops renewing.
#
# Tier lanes are hard protected partitions. organizationTiers is operator-owned
# policy keyed by trusted org id; no client header chooses a tier. weight scales
# that lane's configured capacities. This is weighted admission, not a claim of
# exact request-order scheduling inside Dynamo.
