# Example interceptor settings. Copy to a real location and pass with -f.
debug: false

# Port the interceptor listens on (behind Traefik).
listenPort: 8080

# NOTE: there is no upstream/registry config. phoebe does NOT resolve upstreams.
# The forward target comes ONLY from the X-Saturn-Upstream header that Atlas
# injects on each inference deployment's per-subdomain route; phoebe forwards to
# the address on the envelope and FAILS CLOSED (refuses, never guesses) when the
# header is absent or unparseable.

# How long an idle keep-alive connection stays open BETWEEN requests. It does
# not bound a request in flight; see protection.streamStallTimeout.
idleTimeout: "10m"

# Gateway protection: bounds on what any one request can hold in phoebe. They
# apply to ALL traffic, shared and dedicated, and are set once for the whole
# gateway (they protect phoebe itself, which every tenant shares). Every key is
# optional; an absent key uses the default shown. Values must be positive.
# protection:
#   # Largest request body phoebe reads, on every route (413 above it).
#   maxRequestBodyBytes: 67108864
#   # A single write to the client that makes no progress for this long ends
#   # the request (a client that stopped reading mid-stream). Streams may still
#   # idle between chunks for as long as the engine needs.
#   streamStallTimeout: "2m"
#   # Longest a request may run, from arrival to its last response byte,
#   # including any wake hold. With no response headers by then the client
#   # gets 504; mid-stream the stream is ended.
#   maxStreamDuration: "60m"
#   # Response bytes held in memory for inspection (an incomplete SSE line or a
#   # whole non-streamed body), per request and summed over this replica. Over
#   # either limit the response is cut. The 16 MiB SSE event-line limit still
#   # applies inside the per-request value.
#   maxResponseBufferBytesPerStream: 67108864
#   maxResponseBufferBytesTotal: 268435456
#   # Requests to ONE dedicated endpoint this replica holds while the endpoint
#   # starts from zero; the next gets 503 + Retry-After.
#   maxDedicatedColdHoldsPerEndpoint: 32

# Durable metering emit (M2). Valkey Streams hot path → local-disk WAL fallback
# → structured-log floor. Leave valkeyAddr empty to run WAL-only.
# walPath is a DIRECTORY (tidwall/wal segment log); the historical .jsonl name
# is kept on purpose — a pre-upgrade single-file JSONL WAL found at this exact
# path is auto-imported on startup and renamed aside to "<walPath>.imported".
emit:
  valkeyAddr: "localhost:6379"
  streamName: "phoebe:metering"
  walPath: "/var/lib/phoebe/metering-wal.jsonl"

# TF single-host gateway resolution (OFF by default). On the gateway route the
# request-body model= selects the model: phoebe resolves (X-Saturn-Org-Id,
# model) from the served-model REGISTRY — Atlas-rendered ConfigMaps in the
# workload namespace (label saturncloud.io/tf-served-model: "true"), watched
# by an informer (no database, no per-request I/O; RBAC in
# deploy/rbac-gateway.yaml) — and forwards to
# <graph>-frontend.<namespace>.svc.cluster.local:<port> (the registration's
# port, or `port` below when it carries none). Requests marked
# X-Saturn-Gateway on an interceptor with this disabled are refused (503, fail
# closed); with it enabled they 503 until the registry's first sync, then keep
# resolving from last-known state across API-server flaps. namespace is
# REQUIRED when enabled: it is the platform shared-graph namespace every
# gateway-served graph (and its registry ConfigMap) lives in — phoebe never
# guesses a forward target.
# legacyPostgresResolver: true selects the DEPRECATED direct Atlas-DB
# resolution instead (kept one release for rollback; requires databaseUrl or
# the DATABASE_URL env var; databaseUrl is ignored in registry mode).
# gateway:
#   enabled: true
#   namespace: "saturn-tf-shared"
#   port: 8000
#   kubeconfig: ""
#   legacyPostgresResolver: false
#   databaseUrl: ""

# Wake-from-zero actuation (OFF by default). Shared routes use the Kubernetes
# actuator: it patches the graph's DGDSA <graph>-worker to 1 replica, falling
# back to the legacy <graph>-vllmworker name, and unpauses its KEDA ScaledObject
# <graph>-scaler. That actuator requires
# gateway.namespace (where the DGDSAs live) and the RBAC in
# deploy/rbac-waker.yaml on phoebe's ServiceAccount. It uses in-cluster config;
# kubeconfig is a dev/test override.
#
# Dedicated disaggregated routes use the Atlas actuator configured by atlasURL.
# It asks Atlas to restore the graph's persisted prefill and decode counts, then
# waits for the requested model. Set TF_INTERNAL_WAKE_TOKEN to the same internal
# wake token configured in Atlas. At least one actuator must be configured when
# wake is enabled: gateway.namespace for shared routes or atlasURL for dedicated
# routes. An unavailable actuator degrades to off for its serving mode (cold
# responses pass through) rather than crashing the proxy.
# timeout bounds one wake's request hold (default 300s). It MUST exceed the
# real cold start — vLLM's cold reload measured ~2.5min on staging. If worker
# restoration was confirmed but readiness exceeds this budget, the client gets
# a model-starting 503 with Retry-After guidance. A definite failure before
# actuation returns the original cold response. Measured cold start + headroom,
# not impatience.
# wake:
#   enabled: true
#   kubeconfig: ""
#   atlasURL: "http://atlas.saturn.svc.cluster.local:8000"
#   timeout: "300s"

# Distributed admission for SHARED serving mode (OFF by default). This is
# a fairness and capacity-shaping gate, not an authorization or hard-spend
# boundary. All Phoebe replicas should use the same Valkey. If that state is
# unavailable or reset, otherwise authorized and valid traffic continues while
# these limits are temporarily bypassed. Independent metering still records
# actual engine usage through its Valkey/WAL/log path.
#
# Each request is checked atomically at platform, serving-graph, organization,
# and organization×model scopes. Prompt work is an ESTIMATE in tokens: the
# characters of the request's message text divided by 4, plus a fixed 1024
# tokens per image part (no chat template, no tokenizer). maxPrefillTokens
# bounds that estimate for requests still in prefill. Token windows reserve the
# same estimate as uncached input, then reconcile the engine's exact total and
# cached token counts after the response. Output is
# max_completion_tokens/max_tokens, or defaultMaxOutputTokens.
# maxReservedKvTokens bounds estimated input plus reserved output, held until
# the request finishes. Decode capacity
# is a future slot reserved before forwarding because a proxy cannot safely
# queue once the engine starts responding. Leases release prefill/input work at
# the first upstream body byte and active/decode/output/KV work at completion,
# abort, or failure. Live streams renew their lease;
# leaseTtl is the crash-recovery bound when a replica stops renewing.
#
# Admission lanes are hard protected partitions. organizationLanes is operator-owned
# policy keyed by trusted org id; no client header chooses a lane. weight scales
# that lane's configured capacities. This is weighted admission, not a claim of
# exact request-order scheduling inside Dynamo.
# admission:
#   enabled: true
#   valkeyAddr: "valkey.saturn.svc.cluster.local:6379"
#   keyPrefix: "phoebe:admission"
#   leaseTtl: "15m" # minimum 1s; must exceed admission Valkey I/O latency
#   # keyPrefix, leaseTtl and defaultMaxOutputTokens are used whenever an
#   # admission store resolves (admission.valkeyAddr, else emit.valkeyAddr),
#   # including with enabled: false, because contract limits are enforced then.
#   # In that case an unparsable leaseTtl or one under 1s fails startup.
#   # With no store at all and enabled: false, leaseTtl is not validated.
#   defaultMaxOutputTokens: 4096
#   platform:
#     maxActiveRequests: 256
#     maxConcurrentPrefills: 32
#     maxReservedDecodeSlots: 256
#     maxPrefillTokens: 262144
#     maxReservedOutputTokens: 262144
#     maxReservedKvTokens: null
#     maxActiveAdapters: 128
#     requestsPerWindow: 6000
#     totalPromptTokensPerWindow: 16000000
#     uncachedPromptTokensPerWindow: 4000000
#     generatedTokensPerWindow: 4000000
#     maxColdHolds: 16
#     wakesPerWindow: 30
#     window: "1m"
#   graph:
#     maxActiveRequests: 64
#     maxConcurrentPrefills: 8
#     maxReservedDecodeSlots: 64
#     maxPrefillTokens: 65536
#     maxReservedOutputTokens: 65536
#     maxReservedKvTokens: null
#     maxActiveAdapters: 32
#     requestsPerWindow: 1500
#     totalPromptTokensPerWindow: 4000000
#     uncachedPromptTokensPerWindow: 1000000
#     generatedTokensPerWindow: 1000000
#     maxColdHolds: 4
#     wakesPerWindow: 6
#     window: "1m"
#   organization:
#     maxActiveRequests: 32
#     maxConcurrentPrefills: 4
#     maxReservedDecodeSlots: 32
#     maxPrefillTokens: 32768
#     maxReservedOutputTokens: 32768
#     maxReservedKvTokens: null
#     maxActiveAdapters: 16
#     requestsPerWindow: 600
#     totalPromptTokensPerWindow: 1600000
