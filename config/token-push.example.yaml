# Example token-push settings. Copy to a real location and pass with -f.
#
# token-push is the install-side hourly usage PUSH job: for each hour it reads the
# aggregator's (cmd/rater) rated_usage rollups and sends the complete set of that
# hour's token records to the manager's POST /customer/metered-usage with
# kinds ["token"]. Quantities only; the manager prices. Run it as a CronJob AFTER
# the rater (so it sends the latest rollups), e.g. at :10 if the rater runs at :05.
#
# The customer auth token is NOT configured here: it is read from the SATURN_TOKEN
# environment variable (a mounted secret), so it never lands in a configmap or logs.
# The database connection comes from DATABASE_URL, the phoebe Postgres the rater
# writes.
debug: false

# Base URL of the manager. The endpoint path (/customer/metered-usage) is appended
# automatically. Override with -manager-url.
managerURL: "https://manager.internal.svc.cluster.local"

# How many complete trailing hours each run re-sends (the settle horizon). Matches
# the rater's rateTrailingHours so a late event folded into an old hour reaches the
# manager. Re-sending an hour is idempotent (deterministic usage_id). Default 24.
pushTrailingHours: 24

# Timeout for a single POST attempt. 5xx and network errors are retried with
# backoff (up to 5 attempts); 4xx are never retried. Default 60s.
requestTimeout: "60s"
