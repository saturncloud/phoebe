# RBAC for phoebe's gateway registry resolver (internal/gateway/registry.go)
# and ready-worker informer (internal/gateway/workers.go).
#
# DELIVERABLE, NOT AUTO-APPLIED: the durable home for these objects is the
# saturn-k8s chart (rendered alongside phoebe's Deployment/ServiceAccount);
# this file is the reviewed source of truth for what that chart must grant.
# Apply manually only for dev clusters:
#   kubectl -n <workload-namespace> apply -f deploy/rbac-gateway.yaml
#
# Phoebe reads two things in the workload namespace:
#   1. The resolver (registry.go) watches the served-model registry ConfigMaps
#      Atlas renders (label saturncloud.io/tf-served-model: "true", names
#      tf-model-<model_id>).
#   2. The ready-worker informer (workers.go, NewReadyWorkers) watches the
#      Atlas-managed DynamoGraphDeployments (label
#      saturncloud.io/managed-by=Atlas) and reads
#      status.components.Worker.readyReplicas, so phoebe can scale each
#      graph's per-worker admission limits by (ready workers + 1). The legacy
#      VllmWorker component is read only when the DGD has no Worker component
#      at all; a Worker component with 0 ready reads 0 and does not fall back,
#      so a stale VllmWorker status cannot raise the limit (component names
#      match case-insensitively; D59).
#      Decision D54, approved by Hugo 2026-10-14.
# So phoebe's ServiceAccount needs get/list/watch on configmaps and
# nvidia.com dynamographdeployments THERE and nothing else — no writes, no
# status subresources, no other namespaces.
#
# Without the dynamographdeployments grant the informer's list is refused
# with 403 and never syncs. Phoebe then only logs a watch error, and every
# graph is held to one worker's worth of admission however many workers are
# ready. Nothing fails at startup, so check this grant when a scaled-out
# graph returns capacity 503s.
#
# This file mirrors the saturn-k8s chart template
# charts/phoebe/templates/rbac-gateway.yaml (commit 609a4635 on
# ctask/gateway-admission-q22-rbac-20261014, saturn-k8s #1097); keep the
# Role and RoleBinding names and rules identical in both.
#
# NOTE on scope: k8s RBAC cannot filter by LABEL, so these grants are read
# access to ALL ConfigMaps and ALL DynamoGraphDeployments in the workload
# namespace, not only the registry or Atlas-managed ones (the label selection
# happens client-side in each informer's list/watch options).
# That is why it is a namespace-scoped Role in the dedicated workload
# namespace — never a ClusterRole: nothing secret should live in ConfigMaps
# there (k8s ConfigMaps are not a secret store anyway; Secrets are separate
# objects this Role cannot read).
#
# Replace the two placeholders when applying:
#   <workload-namespace>    the shared-graph namespace (gateway.namespace)
#   <phoebe-serviceaccount> phoebe's ServiceAccount name in that namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phoebe-gateway-registry
  namespace: <workload-namespace>
  labels:
    saturncloud.io/managed-by: "Atlas"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["nvidia.com"]
    resources: ["dynamographdeployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phoebe-gateway-registry
  namespace: <workload-namespace>
  labels:
    saturncloud.io/managed-by: "Atlas"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: phoebe-gateway-registry
subjects:
  - kind: ServiceAccount
    name: <phoebe-serviceaccount>
    namespace: <workload-namespace>
